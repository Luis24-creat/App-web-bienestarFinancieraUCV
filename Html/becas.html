<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Becas - UCV Bienestar Financiero</title>
  <link rel="stylesheet" href="/css/becas.css">
</head>
<body>

  <!-- Toggles para menú y chat -->
  <input type="checkbox" id="navToggle" class="toggle-input" />
  <input type="checkbox" id="chatToggle" class="toggle-input" />

  <!-- Label de hamburguesa -->
  <label for="navToggle" class="menu-toggle" aria-label="Abrir menú">☰</label>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-content">
      <img src="assets/logo_ucv.png" alt="Logo UCV" class="sidebar-logo">
      <nav>
        <ul>
          <li><a href="/Html/dashboard.html">🏠 Dashboard</a></li>
          <li><a href="/Html/becas.html" class="active">🎓 Becas</a></li> 
          <li><a href="/Html/metas.html">💰 Metas</a></li>
          <li><a href="/Html/transacciones.html">💳 Transacciones</a></li>
          <li><a href="/Html/perfil.html">👤 Perfil</a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Header -->
  <header>
    <h1>Gestión de Becas</h1>
  </header>

  <!-- Main -->
  <main>
    <section id="gestionBecas">
      <div class="becas-info-container">

        <!-- Contenedor Mis Becas Activas -->
        <div id="activasContainer" class="lista-tarjetas">
          <!-- Firebase llenará las becas activas aquí -->
        </div>

        <!-- Contenedor Becas Disponibles -->
        <div id="disponiblesContainer" class="lista-tarjetas">
          <!-- Firebase llenará las becas disponibles aquí -->
        </div>

        <!-- Contenedor Próximos pasos / Fechas importantes -->
        <ul id="recordatoriosContainer">
          <!-- Firebase llenará las fechas importantes aquí -->
        </ul>

      </div>
    </section>
  </main>

  <!-- Burbuja del Chat IA -->
  <label for="chatToggle" class="chat-bubble" aria-label="Abrir chat">💬</label>

  <!-- Caja de Chat -->
  <div class="chat-box" id="chatBox" role="dialog" aria-hidden="true">
    <div class="chat-header">
      <h4>Asistente Financiero IA</h4>
      <label for="chatToggle" class="close-chat" aria-label="Cerrar chat">✖</label>
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- Firebase llenará los mensajes aquí -->
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Escribe tu pregunta..." />
      <button id="sendBtn" type="button">Enviar</button>
    </div>
  </div>

  <script type="module" src="/JS/becas.js"></script>
  <script type="module" src="/JS/IA.JS"></script>
</body>
</html>
