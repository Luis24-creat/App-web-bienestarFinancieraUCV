<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - UCV Bienestar Financiero</title>
  <link rel="stylesheet" href="/css/register.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <img src="assets/logo_ucv.png" alt="Logo UCV" class="logo" />
      <h1>Crear cuenta</h1>

      <form id="registerForm">
        <!-- Nombre completo -->
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" required />

        <!-- Correo electrónico -->
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.edu" required />

        <!-- Contraseña -->
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="********" required />

        <!-- Carrera -->
        <label for="carrera">Carrera</label>
        <select id="carrera" required>
          <option value="">Selecciona tu carrera...</option>
          <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
          <option value="Ingeniería Industrial">Ingeniería Industrial</option>
          <option value="Administración de Empresas">Administración de Empresas</option>
          <option value="Contabilidad">Contabilidad</option>
          <option value="Derecho">Derecho</option>
          <option value="Psicología">Psicología</option>
          <option value="Educación Inicial">Educación Inicial</option>
          <option value="Enfermería">Enfermería</option>
          <option value="Arquitectura">Arquitectura</option>
          <option value="Comunicación">Comunicación</option>
        </select>

        <!-- Campus -->
        <label for="campus">Campus</label>
        <select id="campus" required>
          <option value="">Selecciona tu campus...</option>
          <option value="Ate">Ate</option>
          <option value="Chepén">Chepén</option>
          <option value="Chiclayo">Chiclayo</option>
          <option value="Chimbote">Chimbote</option>
          <option value="San Juan de Lurigancho">San Juan de Lurigancho</option>
          <option value="Los Olivos">Los Olivos</option>
          <option value="Piura">Piura</option>
          <option value="Tarapoto">Tarapoto</option>
        </select>

        <!-- Teléfono -->
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="EJM:900685264" />

        <!-- Sexo -->
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="">Selecciona...</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Otro">Otro</option>
        </select>

        <!-- Fecha de nacimiento -->
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento" />

        <!-- Botón de registro -->
        <button type="submit" class="btn">Registrarse</button>
      </form>

      <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
      <p id="mensaje"></p>
    </section>
  </main>

  <script type="module" src="/JS/register.js"></script>
</body>
</html>
