<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesoría Financiera - UCV Bienestar Financiero</title>
  <link rel="stylesheet" href="/css/asesoria.css">
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

 <!-- 🔵 Barra superior -->
  <header class="topbar">
    <label for="navToggle" class="menu-toggle" aria-label="Abrir menú">☰</label>

    <h1>UCV Bienestar Financiero</h1>
    <div class="user-info">
      <span id="userEmail">Cargando...</span>
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>


  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-content">
      <img src="/assets/icono de Bienestar Finaciera.png" alt="Logo UCV" class="sidebar-logo">
      <nav>
        <ul>
          <li><a href="/Html/dashboard.html">🏠 Dashboard</a></li>
          <li><a href="/Html/presupuesto.html" >💰 Presupuesto y Transacciones</a></li>
          <li><a href="/Html/educacion.html">🎓 Educación Financiera</a></li>
          <li><a href="/Html/metas.html">🎯 Metas</a></li>
          <li><a href="/Html/inteligentes.html">🧮 Finanzas Inteligentes</a></li>
          <li><a href="/Html/beneficios.html">🏷 Beneficios</a></li>
          <li><a href="/Html/asesoria.html"class="active">📞 Asesoría</a></li>
          <li><a href="/Html/perfil.html">⚙️ Configuración</a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main>
    <!-- Formulario de cita -->
    <section class="formulario-cita">
      <h2>Solicitar Cita con Asesor</h2>
      <form id="formCita">
        <label>Nombre completo</label>
        <input type="text" id="nombreCita" placeholder="Tu nombre" required>

        <label>Correo institucional</label>
        <input type="email" id="emailCita" placeholder="ejemplo@ucv.edu.pe" required>

        <label>Mensaje / Motivo</label>
        <textarea id="mensajeCita" placeholder="Describe tu consulta" required></textarea>

        <button type="submit">Enviar Solicitud</button>
      </form>
    </section>

    <!-- Historial de consultas -->
    <section class="historial-consultas">
      <h2>Historial de Consultas</h2>

      <!-- Filtro por estado -->
      <div class="filtros">
        <label>Filtrar por estado:</label>
        <select id="filtroEstado">
          <option value="todos">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="respondida">Respondida</option>
        </select>
      </div>

      <ul id="listaConsultas">
        <!-- Firebase cargará las consultas aquí -->
      </ul>
    </section>
  </main>

  <script type="module" src="/JS/asesoria.js"></script>
</body>
</html>
