<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transacciones - UCV Bienestar Financiero</title>
  <link rel="stylesheet" href="css/transacciones.css">
</head>
<body>

    <!-- 🟢 Menú lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-content">
      <img src="/assets/icono de Bienestar Finaciera.png" alt="Logo UCV" class="sidebar-logo">
      <nav>
        <ul>
          <li><a href="/Html/dashboard.html">🏠 Dashboard</a></li>
          <li><a href="/Html/becas.html">🎓 Becas</a></li>
          <li><a href="/Html/metas.html" class="active">💰 Metas</a></li>
          <li><a href="/Html/transacciones.html">💳 Transacciones</a></li>
          <li><a href="/Html/perfil.html">👤 Perfil</a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <header><h1>Transacciones</h1></header>

  <main>
    <form id="formTransaccion">
      <label>Tipo:</label>
      <select id="tipo">
        <option value="ingreso">Ingreso</option>
        <option value="gasto">Gasto</option>
      </select>

      <label>Descripción:</label>
      <input type="text" id="descripcion" required>

      <label>Monto:</label>
      <input type="number" id="monto" required>

      <button type="submit" class="btn">Guardar</button>
    </form>

    <section id="listaTransacciones"></section>
  </main>

  <script type="module" src="js/transacciones.js"></script>
</body>
</html>
